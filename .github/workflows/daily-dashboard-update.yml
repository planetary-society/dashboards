# GitHub Action Workflow: Daily Dashboard Update
#
# This workflow runs daily to:
# 1. Download the cancellations dashboard CSVs (see DATA_FILES below).
# 2. Compare them against the deployed copies and update only what changed.
# 3. Rewrite docs/data/cancellations/metadata.json when data changed.
# 4. Run the Node test suite, then bake static SEO content (the headline figures
#    in index.html, per-district pages, sitemap) via scripts/bake-seo.mjs.
# 5. Commit whatever changed and deploy the static dashboards to GitHub Pages.
#
# Every file the dashboard reads is generated upstream, so all three are synced
# the same way. Adding a fourth means adding one line to DATA_FILES -- the
# download, compare and metadata steps all iterate that list.

name: Daily Dashboard Update

on:
  schedule:
    # runs every day at 10:00 AM Pacific Time (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual triggering

env:
  # Every CSV the dashboard reads, all published to output/ upstream. The
  # fiscal-year rollup changes far less often than the other two, but it is
  # generated the same way, so it is synced rather than hand-copied.
  DATA_FILES: >-
    terminations
    doge_claims
    cancellations_for_convenience_awards_by_fiscal_year
  UPSTREAM_REPO: planetary-society/nasa-cancellations-tracking

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit changes
      pages: write      # Required to deploy to GitHub Pages
      id-token: write   # Required for trusted deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download cancellations CSVs from GitHub
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp_data
          : > tmp_data/dates.tsv

          for f in $DATA_FILES; do
            # Date comes from the most recent commit that touched this file upstream
            DATE=$(gh api "repos/${UPSTREAM_REPO}/commits?path=output/${f}.csv&per_page=1" \
              --jq '.[0].commit.committer.date | split("T")[0]')

            if [[ -z "$DATE" ]]; then
              echo "::error::No commit history found for output/${f}.csv upstream"
              exit 1
            fi

            echo "${f}.csv last updated: ${DATE}"
            # A TSV rather than per-file step outputs: the metadata step reads
            # this back, so adding a file needs no new plumbing.
            printf '%s\t%s\n' "$f" "$DATE" >> tmp_data/dates.tsv

            # curl -f makes a 404 fail the job: a file that vanished upstream
            # must stop the deploy, not quietly ship yesterday's copy.
            curl -fL -o "tmp_data/${f}.csv" \
              "https://raw.githubusercontent.com/${UPSTREAM_REPO}/main/output/${f}.csv"
          done

      - name: Compare and update if changed
        id: compare
        run: |
          mkdir -p docs/data/cancellations
          CHANGED=false

          for f in $DATA_FILES; do
            SRC="tmp_data/${f}.csv"
            DEST="docs/data/cancellations/${f}.csv"

            if [[ -f "$DEST" ]] && cmp -s "$SRC" "$DEST"; then
              echo "${f}.csv: no changes detected - files are identical"
            else
              echo "${f}.csv: changes detected, updating"
              cp -v "$SRC" "$DEST"
              CHANGED=true
            fi
          done

          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          ls -la docs/data/cancellations/

      - name: Update metadata
        if: steps.compare.outputs.changed == 'true'
        run: |
          # Written with json.dump rather than shell string interpolation so the
          # file is always valid JSON regardless of what the values contain.
          # Row counts are CSV-aware: the files have CRLF endings and quoted
          # embedded newlines, so wc -l overcounts.
          python3 - <<'PY'
          import csv
          import json
          import os

          # The date the page states -- "Data updated {date}" and the JSON-LD
          # dateModified -- describes the award records. The fiscal-year rollup
          # is regenerated on its own cadence, so a fresh rollup must not make
          # the page claim newer award data than it actually has.
          HEADLINE_FILES = ("terminations", "doge_claims")

          with open("tmp_data/dates.tsv") as fh:
              dates = dict(line.rstrip("\n").split("\t") for line in fh if line.strip())

          files = {}
          for name in os.environ["DATA_FILES"].split():
              path = f"docs/data/cancellations/{name}.csv"
              with open(path, newline="") as fh:
                  rows = sum(1 for _ in csv.reader(fh)) - 1
              files[name] = {"lastUpdated": dates[name], "rowCount": rows}
              print(f"{name}: {rows} rows ({dates[name]})")

          headline = [files[n]["lastUpdated"] for n in HEADLINE_FILES if n in files]
          if not headline:
              raise SystemExit("no headline data file present -- refusing to write metadata")

          metadata = {"lastUpdated": max(headline), "files": files}

          with open("docs/data/cancellations/metadata.json", "w") as fh:
              json.dump(metadata, fh, indent=2)
              fh.write("\n")

          print(json.dumps(metadata, indent=2))
          PY

      # Gate the bake on the full suite (known-broken cases are skipped inside
      # their test files, so this is the same command a developer runs locally).
      - name: Run tests
        run: npm test

      # Unconditional by design: the bake is idempotent (all dates come from
      # metadata.json, never "today"), so a no-change day writes byte-identical
      # files and nothing commits -- but bake-script or template fixes take
      # effect on the next run, and a previously failed bake self-heals.
      # A bake failure fails the job and skips the deploy; the site stays on
      # yesterday's build. That is the intended failure mode -- do not soften.
      - name: Bake static SEO content
        run: node scripts/bake-seo.mjs

      # No `if:` guard: bake output must commit even on days when the CSVs did
      # not change (otherwise the deployed artifact and the repo drift apart,
      # and the same diff reappears every run). The action no-ops on a clean
      # tree. The docs/cancellations/** glob stages district-page deletions
      # from the bake's delete-and-rebuild too.
      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: daily data refresh"
          file_pattern: "docs/data/cancellations/* docs/cancellations/** docs/sitemap.xml"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
