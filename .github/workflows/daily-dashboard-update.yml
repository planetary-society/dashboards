# GitHub Action Workflow: Daily Dashboard Update
#
# This workflow runs daily to:
# 1. Download the master ledger CSV for the cancellations dashboard.
# 2. Compare and clean up data files.
# 3. Commit new data if changed.
# 4. Deploy the static D3.js dashboards to GitHub Pages.

name: Daily Dashboard Update

on:
  schedule:
    # runs every day at 10:00 AM Pacific Time (15:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to commit changes
      pages: write      # Required to deploy to GitHub Pages
      id-token: write   # Required for trusted deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download master ledger from GitHub
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data

          # Date comes from the most recent commit that touched the master ledger
          DATE=$(gh api "repos/planetary-society/nasa-cancellations-tracking/commits?path=consolidated/master_ledger.csv&per_page=1" \
            --jq '.[0].commit.committer.date | split("T")[0]')

          echo "Master ledger last updated: $DATE"
          echo "source_date=$DATE" >> $GITHUB_OUTPUT

          # Download directly to data directory
          curl -fL -o "data/master_ledger_${DATE}.csv" \
            "https://raw.githubusercontent.com/planetary-society/nasa-cancellations-tracking/main/consolidated/master_ledger.csv"

      - name: Compare and update if changed
        id: compare
        run: |
          DOCS_FILE="docs/data/cancellations/master_ledger_latest.csv"
          DATA_FILE="data/master_ledger_${{ steps.download.outputs.source_date }}.csv"
          mkdir -p docs/data/cancellations

          echo "DATA_FILE: $DATA_FILE"
          echo "DOCS_FILE: $DOCS_FILE"
          echo "Data file exists: $(test -f "$DATA_FILE" && echo yes || echo no)"
          echo "Docs file exists: $(test -f "$DOCS_FILE" && echo yes || echo no)"

          if [[ -f "$DOCS_FILE" ]] && cmp -s "$DATA_FILE" "$DOCS_FILE"; then
            echo "No changes detected - files are identical"
            echo "changed=false" >> $GITHUB_OUTPUT
            rm "$DATA_FILE"
          else
            echo "Changes detected, updating files"
            echo "changed=true" >> $GITHUB_OUTPUT

            # Remove old master ledger CSVs from data dir, keep only the new one
            find data -name "master_ledger_*.csv" ! -name "$(basename $DATA_FILE)" -delete

            # Update docs with new file
            cp -v "$DATA_FILE" "$DOCS_FILE"

            # Count data rows (CSV-aware: the file has CRLF endings and quoted
            # embedded newlines, so wc -l overcounts)
            ROW_COUNT=$(python3 -c "import csv,sys; print(sum(1 for _ in csv.reader(open('$DOCS_FILE', newline=''))) - 1)")

            # Update metadata
            echo "{\"lastUpdated\": \"${{ steps.download.outputs.source_date }}\", \"rowCount\": ${ROW_COUNT}}" > docs/data/cancellations/metadata.json
            echo "Updated metadata: ${{ steps.download.outputs.source_date }} (${ROW_COUNT} rows)"

            # Verify files were updated
            echo "Docs file after copy:"
            head -1 "$DOCS_FILE"
            ls -la docs/data/cancellations/
          fi

      - name: Commit & push changes
        if: steps.compare.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily data refresh"
          file_pattern: "data/*.csv docs/data/cancellations/*"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
