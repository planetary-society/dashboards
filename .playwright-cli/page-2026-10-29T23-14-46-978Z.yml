            - generic [ref=e26]:
                - heading "Analysis" [level=1] [ref=e28]
                - paragraph [ref=e29]: Assessing scientific productivity of NASA’s space missions by cost.
                - paragraph [ref=e30]: A. H. D. Koeppel and C. Dreier, The Planetary Society. Data as of Oct. 28, 2026.
                - separator [ref=e31]
            - article [ref=e32]:
                - generic [ref=e33]:
                    - generic [ref=e34]:
                        - heading "Introduction" [level=2] [ref=e35]
                        - paragraph [ref=e36]:
                            - text: One of the stated goals of the current NASA administration is maximizing science per dollar.
                            - superscript [ref=e37]:
                                - link "Reference 1" [ref=e38] [cursor=pointer]:
                                    - /url: "#ref-1"
                                    - text: "1"
                            - text: Another is faster time to science.
                            - superscript [ref=e39]:
                                - link "Reference 2" [ref=e40] [cursor=pointer]:
                                    - /url: "#ref-2"
                                    - text: "2"
                            - text: For decades, NASA has struggled to reduce science mission costs and increase project cadence.
                            - superscript [ref=e41]:
                                - link "Reference 3" [ref=e42] [cursor=pointer]:
                                    - /url: "#ref-3"
                                    - text: "3"
                            - text: Despite cost overruns and schedule challenges, the National Academies have consistently highlighted the unique value of NASA’s large strategic missions.
                            - superscript [ref=e43]:
                                - link "Reference 4" [ref=e44] [cursor=pointer]:
                                    - /url: "#ref-4"
                                    - text: "4"
                            - text: However, the National Academies’ decadal survey
                            - superscript [ref=e45]:
                                - link "Reference 5" [ref=e46] [cursor=pointer]:
                                    - /url: "#ref-5"
                                    - text: "5"
                            - text: and congressional statute
                            - superscript [ref=e47]:
                                - link "Reference 6" [ref=e48] [cursor=pointer]:
                                    - /url: "#ref-6"
                                    - text: "6"
                            - text: also state that frequent, low-cost science missions are a cornerstone of a balanced program portfolio.
                        - paragraph [ref=e49]:
                            - text: Programmatic experiments aimed at reducing cost and development time with low-cost missions are underway. NASA’s CubeSat, SIMPLEx, and Commercial Lunar Payload Services (CLPS) programs have produced dozens of low-cost missions across all science divisions since the late 2000s. Ride shares, commercial hardware, reusable components, and in-kind contributions have further driven down costs.
                            - superscript [ref=e50]:
                                - link "Reference 7" [ref=e51] [cursor=pointer]:
                                    - /url: "#ref-7"
                                    - text: "7"
                                - text: ","
                                - link "Reference 8" [ref=e52] [cursor=pointer]:
                                    - /url: "#ref-8"
                                    - text: "8"
                        - paragraph [ref=e53]:
                            - text: Recent amendments to NASA’s competitive mission selection process have the stated aim of decreasing development and selection time.
                            - superscript [ref=e54]:
                                - link "Reference 2" [ref=e55] [cursor=pointer]:
                                    - /url: "#ref-2"
                                    - text: "2"
                            - text: NASA originally aimed for two New Frontiers competitions per decade and Discovery mission launches every two years, but budget uncertainty has stalled announcements, producing a 10-year gap for New Frontiers (next selection expected 2027) and a gap of more than seven years for Discovery. Meanwhile, development of new directed science missions, such as the Aeolus and Skyfall missions to Mars and PROMISE Rover to the Moon, is proceeding quickly.
                        - paragraph [ref=e56]:
                            - text: The recent uptick in the number of directed and low-cost missions, paired with the changes for competed missions, reflects a reprioritization. To prepare for precisely this type of restructuring, the National Academies’ 2017 report, Powering Science, recommended NASA develop a publicly accessible database that might be used to assess the value of different mission classes.
                            - superscript [ref=e57]:
                                - link "Reference 4" [ref=e58] [cursor=pointer]:
                                    - /url: "#ref-4"
                                    - text: "4"
                            - text: Nearly a decade later, NASA has not released such a database.
                        - paragraph [ref=e59]:
                            - text: To inform current discussions in the mission science community with quantitative evidence, we compiled a comprehensive database covering 141 science missions launched since 1980. We focused on science impact, cost, and time to impactful science. The
                            - link "overview" [ref=e60] [cursor=pointer]:
                                - /url: /science-mission-impact/
                            - text: gives the short version; this page sets out the analysis.
