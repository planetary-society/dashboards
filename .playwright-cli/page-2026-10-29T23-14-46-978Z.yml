                        - paragraph [ref=e895]: "Considering divisional differences, Astrophysics, Heliophysics, and Planetary Science have each produced successful missions at the low end of their division’s cost range with a high ratio of high-impact publications to mission cost: HaloSat in Astrophysics; ELFIN, TRACE, MinXSS-1, and FAST in Heliophysics; and Lunar Prospector in Planetary Science. Earth Science has none by this measure."
