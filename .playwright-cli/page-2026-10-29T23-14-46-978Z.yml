                        - paragraph [ref=e534]: Of the 46 analyzed missions costing $150M or less, 14 (or 30%) have failed or fallen short of their goals due to a technical issue, while only 8.4% of all other missions did. This means that under historical risk postures, in order for low-cost missions to sustain the publication output of larger missions, the average successful low-cost mission would have to be about 32% more productive for the cost. In fact, the $150M-or-less group averages 3.2 high-impact papers per mission, compared with 115 for larger missions (in the four divisions we compare). Normalized by cost, they are less cost-efficient than larger missions at drawing citations in three of those four divisions.
