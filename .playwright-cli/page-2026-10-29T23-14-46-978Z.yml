                        - heading "Divisional cost-sensitivity" [level=2] [ref=e811]
                        - paragraph [ref=e812]: The data also reflect a strong sensitivity of low-cost mission output to division (Figure 4). Heliophysics missions have had more high-impact publication productivity in the $150M-or-less classes than any other division. Astrophysics missions costing $150M or less have produced less than one high-impact paper between them, but missions in the $150M to $350M range have produced the greatest return per dollar spent. Likewise, in Earth Science, missions costing more than $1.55B, and in Planetary Science, missions in the $750M to $1.55B range, have produced the greatest return per dollar spent.
                        - paragraph [ref=e813]: These differences reflect the varying technical requirements of different science goals. For example, a $200M mission in low Earth orbit and a $200M mission landed on another planet do not belong to a common class that can predict scientific return. These distinctions indicate that a fixed cost cap does not carry the same meaning across all of NASA space science.
