                            - generic [ref=e1548]: "Figure 7. Publication volume 33 months after the start of prime mission divided by cost for planetary surface missions: refereed papers per $1B of life-cycle cost. CLPS counts all four landers from the first launch; each lander’s own mark is its papers to date."
                - generic [ref=e1550]:
                    - heading "Maximizing science per dollar" [level=2] [ref=e1551]
                    - paragraph [ref=e1552]: Our results do not support investing in more directed and low-cost missions purely as a means of reducing the cost of science. Among the most efficient missions in terms of high-impact publications per dollar have been competed mid-to-large missions (e.g., Discovery, New Frontiers, MIDEX, Earth System Science Pathfinder). Given the outsized success of these missions, accepting more risk in the mid-to-large tiers may yield cost savings.
                - generic [ref=e1554]:
                    - heading "Beyond science" [level=2] [ref=e1555]
                    - paragraph [ref=e1556]: The cases for missions of different sizes extend beyond cost alone. Small missions broaden participation, train early-career researchers on flight hardware and testing, build institutional capacity, and mature affordable technologies that other missions and industry later adopt. Large strategic missions develop radically new technologies, access domains once thought impossible to investigate, sustain entire fields for decades, and offer high-profile opportunities for international visibility and collaboration. These factors should each be weighed alongside science when gauging the value of a new program.
