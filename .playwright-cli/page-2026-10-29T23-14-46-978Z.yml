                        - paragraph [ref=e87]:
                            - text: "Research community sizes and publication cultures differ across NASA’s five science divisions: Earth Science, Planetary Science, Heliophysics, Astrophysics, and Biological and Physical Sciences. Thus, we define science impact relative to the body of work retrieved for each division. We define “field-defining” publications as those in the top 1% of citation counts for their respective division. “High-impact” works are in the top 10%. “Above-average” works are in the top 50%. Each paper’s citations count over the four years from its publication; the"
                            - link "Methods" [ref=e88] [cursor=pointer]:
                                - /url: /science-mission-impact/methods/
                            - text: page explains how we gathered the papers, citations and costs.
                        - paragraph [ref=e89]: Citation thresholds are a common approach to quantifying impact, used by NSF, universities, and others. We use them two ways.
