                        - paragraph [ref=e897]: "To gain insight into common themes that could inform program strategy for low-cost programs, we interviewed PIs and managers from four Heliophysics missions, three Astrophysics missions, two Earth Science missions, and one Planetary Science mission. Those conversations revealed three common keys to success:"
