                - generic [ref=e200]:
                    - generic [ref=e201]:
                        - heading "Time to science" [level=2] [ref=e202]
                        - paragraph [ref=e203]: "Results from past missions show that the relationship between cost and “time to science,” measured from start of formulation to the publication date of a mission’s first high-impact paper, is not linear. (Here each paper is ranked on all its citations to date, and failed missions are left out.) Very low-cost missions can take years to publish a highly cited result, largely negating their rapid development advantage: of the 26 missions of $50M or less that didn’t fail, only six have one, after a median 5.8 years. Very expensive missions return high-impact results quickly once operations begin (a median 0.2 years for those costing more than $1.55B, against 2.3 for missions of $50M or less; Figure 1), but face protracted development times (11.5 years from formulation)."
                        - paragraph [ref=e204]: Low-cost ($50M to $150M), but not CubeSat-class, missions have historically provided the minimum time to science, with a median of 5.5 years from formulation to first high-impact paper, though missions of $150M to $350M were close behind at 5.7. However, no single mission in our evaluation set returned a high-impact result in less than 2.7 years from formulation (QuikSCAT, a rapid reflight of the NASA Scatterometer mission, cut short in 1997 when the Japanese ADEOS satellite carrying it failed).
