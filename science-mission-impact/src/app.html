<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Casey Dreier/The Planetary Society" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://www.planetary.org/img/site/apple-touch-icon-180x180.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://www.planetary.org/img/site/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="https://www.planetary.org/img/site/favicon-16x16.png"
    />
    <link
      rel="shortcut icon"
      href="https://www.planetary.org/img/site/favicon.ico"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@exploreplanets" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Planetary Society" />
    %sveltekit.head%

    <!-- Fathom Analytics -->
    <script
      src="https://phenomenal-terrific.planetary.org/script.js"
      data-site="UDDGKLNZ"
      defer
    ></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
